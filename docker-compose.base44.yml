services:
  web:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    ports:
      - "3000:3000"
    environment:
      # Sandbox-only values, supplied by the platform; empty/unset outside it.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PREVIEW_MODE
      - BASE44_SANDBOX_HOST_DOMAIN
      - CHOKIDAR_USEPOLLING=1
    volumes:
      - ./:/app
      # Dependencies live in a named volume so bind-mounting the source from the
      # sandbox does not hide them; they are installed on startup from package.json.
      - node_modules:/app/node_modules
    labels:
      base44.project: website
      base44.kind: web
      base44.port: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:3000/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    restart: on-failure

volumes:
  node_modules:
